{{- $lang := .Type | default "text" -}}
{{- $summary := printf "%s" (upper $lang) -}}
{{- with .Attributes -}}
  {{- with index . "summary" -}}
    {{- $summary = . -}}
  {{- end -}}
{{- end -}}
<details class="code-fold" open>
  <summary>{{- $summary -}}</summary>
  {{- highlight .Inner $lang .Options -}}
</details>
